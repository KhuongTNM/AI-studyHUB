spring.application.name=ai-study-hub-backend
server.port=8080

app.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=AIStudyHub;encrypt=true;trustServerCertificate=true}
app.datasource.username=${DB_USERNAME:sa}
app.datasource.password=${DB_PASSWORD:12345678}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false

app.jwt.secret=${JWT_SECRET:AIStudyHubDevSecretKeyMustBeAtLeast32CharactersLong}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.auth.max-login-attempts=5
NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:207590091116-dhri27e8ejk82ap2meotqba378r03ssh.apps.googleusercontent.com}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

app.upload.dir=${UPLOAD_DIR:./uploads}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB

# Resend Email Configuration
resend.api-key=${RESEND_API_KEY:re_MQPwtyR1_MWWmFFqzMafuV4ygzi7KDGHX}
resend.from-email=${RESEND_FROM_EMAIL:onboarding@resend.dev}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
